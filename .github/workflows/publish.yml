name: Publish CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Unpublished package version to release from main (e.g. 1.11.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup npm with trusted publishing support
        run: npm install --global npm@11

      - name: Verify release version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Manual publishing must run from main."
              exit 1
            fi
            RELEASE_VERSION="$MANUAL_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version ($RELEASE_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish
